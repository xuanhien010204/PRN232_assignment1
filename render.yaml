services:
  - type: web
    name: product-store
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: DATABASE_URL
        fromDatabase:
          name: product-store-db
          property: connectionString
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: product-store-db
          property: connectionString

databases:
  - name: product-store-db
    databaseName: product_store
    user: postgres
    plan: free